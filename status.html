<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#f6f1ea"><title>Статус заказа</title>
<style>
:root{--bg:#f6f1ea;--bg2:#efe6da;--card:#fffdf9;--ink:#1f1a15;--mut:#7a7166;--ac:#a35a6b;--ac2:#d08a74;--ok:#4f8a5b;--line:#e6dccf}
@media(prefers-color-scheme:dark){:root{--bg:#120f0d;--bg2:#1c1714;--card:#1d1916;--ink:#f3ede5;--mut:#a89f94;--ac:#e08ea0;--ac2:#e9a98f;--ok:#7fc08a;--line:#342d27}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;color:var(--ink);font:16px/1.45 -apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
 background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--ac) 18%,var(--bg)) 0%,var(--bg) 60%) fixed,var(--bg)}
.top{padding:calc(18px + env(safe-area-inset-top)) 22px 0;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;flex:none;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 35%,transparent)}
.shop{font-weight:800;font-size:19px;letter-spacing:-.2px}.shop small{display:block;font-weight:500;font-size:13px;color:var(--mut)}
main{flex:1;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;padding:18px 22px 0}
.hero{text-align:center;padding:16px 0 6px}
.ring{width:min(46vw,190px);aspect-ratio:1;margin:6px auto 14px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}.ring .fg{stroke:url(#g);transition:stroke-dashoffset .8s ease}
.ring .ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--ac)}.ring .ic svg{width:42%;height:42%;transform:none}.ring .ic circle{stroke-width:1.8;stroke:currentColor}
.st{font-size:clamp(26px,7.5vw,34px);font-weight:800;letter-spacing:-.6px;margin:0}
.bn{color:var(--mut);margin:6px 0 0;font-size:16px}
.when{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 14px;border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,var(--card));font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:8px 18px;margin:22px 0 0;box-shadow:0 10px 30px rgba(60,40,25,.06)}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:14px;align-items:center;padding:13px 0;color:var(--mut);position:relative}
li+li{border-top:1px dashed var(--line)}
li i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;background:var(--card)}
li.d{color:var(--ink)}li.d i{background:var(--ok);border-color:var(--ok);color:#fff}
li.c{color:var(--ink);font-weight:700}li.c i{border-color:var(--ac);color:var(--ac);box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 18%,transparent);animation:p 1.8s infinite}
li span{flex:1}li b{font-size:12px;font-weight:700;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);padding:3px 9px;border-radius:99px}
@keyframes p{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--ac) 6%,transparent)}}
.note{color:var(--mut);font-size:13px;text-align:center;margin:16px 0 0}
.bar{position:sticky;bottom:0;margin-top:auto;padding:16px 22px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:560px;width:100%;margin-left:auto;margin-right:auto;
 background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;font-weight:700;text-decoration:none;font-size:16px}
.call{background:var(--ink);color:var(--bg)}.wa{background:#25D366;color:#fff}
.bar svg{width:20px;height:20px}
.err{flex:1;display:grid;place-items:center;text-align:center;color:var(--mut);padding:40px 10px}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--line),var(--bg2),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px auto}
@keyframes sk{to{background-position:-200% 0}}
.rate{text-align:center;padding:16px 18px 18px}.rate h2{margin:4px 0 4px;font-size:20px}.rate p{color:var(--mut);margin:0 0 10px;font-size:14px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}.stars button{all:unset;cursor:pointer;font-size:40px;line-height:1;color:var(--line);transition:transform .1s}.stars button.on{color:#f5b301}.stars button:active{transform:scale(.9)}
.rate textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.rbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:16px;margin-top:10px;font-weight:700;font-size:16px;font-family:inherit;background:var(--ac);color:#fff;text-decoration:none;cursor:pointer}.rbtn:disabled{opacity:.5}.rbtn.g{background:#19aa1e}
</style></head><body>
<div class="top"><span class="logo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13c-3 0-5-2-5-5 2 0 3.5.6 5 2 1.5-1.4 3-2 5-2 0 3-2 5-5 5z"/><path d="M12 10V5M9.5 6.5 12 4l2.5 2.5"/><path d="M12 17c-2-2-4-2-6-1M12 17c2-2 4-2 6-1"/></svg></span><div class="shop" id="shop">Mirflowers<small>Статус заказа</small></div></div>
<main id="main"><div class="hero"><div class="sk" style="width:60%;height:28px"></div><div class="sk" style="width:40%"></div></div></main>
<div id="rate" style="width:100%;max-width:560px;margin:0 auto;padding:0 22px"></div>
<div class="bar" id="bar" hidden></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyCDxDJvmIOw8R0kP7bNbiBHYDAOqY_9cSQ",authDomain:"mirflowersbase.firebaseapp.com",projectId:"mirflowersbase",storageBucket:"mirflowersbase.firebasestorage.app",messagingSenderId:"142575786641",appId:"1:142575786641:web:de2d1b79b076894c29fd30"};firebase.initializeApp(cfg);const fdb=firebase.firestore();if(window.__FSEMU)fdb.useEmulator("127.0.0.1",8080);
const $=id=>document.getElementById(id),k=new URLSearchParams(location.search).get("t")||"";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IC={0:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',1:'<path d="M12 21v-8"/><path d="M12 13c-3 0-5-2-5-5 2 0 3.5.6 5 2 1.5-1.4 3-2 5-2 0 3-2 5-5 5z"/><path d="M12 17c-2-2-4-2-6-1M12 17c2-2 4-2 6-1"/>',2:'<path d="M20 6 9 17l-5-5"/>',3:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',4:'<path d="M20 12v8H4v-8M2 7h20v5H2zM12 22V7M12 7c-2-4-6-4-6-1s6 1 6 1zm0 0c2-4 6-4 6-1s-6 1-6 1z"/>',5:'<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>'};
const svg=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const hd=(d,t)=>{if(!d)return"";const td=new Date().toLocaleDateString("sv-SE"),tm=new Date(Date.now()+864e5).toLocaleDateString("sv-SE");const w=d===td?"сегодня":d===tm?"завтра":(+d.slice(8))+" "+MON[+d.slice(5,7)-1];return w+(t?" в "+t.slice(0,5):"")};
let RS=0,RD=null;
async function rateUi(d){const box=$("rate");if(d.st!==4){box.innerHTML="";return}if(RD)return;RD=d;
 let r=null;try{const x=await fdb.collection("reviews").doc(k).get();if(x.exists)r=x.data()}catch(e){}
 if(r)return rateDone(r.s,d);
 box.innerHTML='<div class="card rate"><h2>Как вам букет?</h2><p>Поставьте оценку — нам важно ваше мнение</p><div class="stars">'+[1,2,3,4,5].map(i=>'<button type="button" data-s="'+i+'" aria-label="'+i+'">★</button>').join("")+'</div><textarea id="rc" maxlength="500" placeholder="Комментарий (необязательно)"></textarea><button class="rbtn" id="rsend" disabled>Отправить</button></div>';
 box.querySelector(".stars").onclick=e=>{const b=e.target.closest("button");if(!b)return;RS=+b.dataset.s;box.querySelectorAll(".stars button").forEach(x=>x.classList.toggle("on",+x.dataset.s<=RS));$("rsend").disabled=false};
 $("rsend").onclick=async()=>{if(!RS)return;$("rsend").disabled=true;$("rsend").textContent="Отправляю…";const c=$("rc").value.trim().slice(0,500);
  try{await fdb.collection("reviews").doc(k).set(c?{s:RS,c}:{s:RS});rateDone(RS,d)}catch(e){$("rsend").disabled=false;$("rsend").textContent="Не отправилось, попробуйте ещё раз"}}}
function rateDone(s,d){const st="★".repeat(s)+"☆".repeat(5-s);
 $("rate").innerHTML='<div class="card rate"><div style="font-size:30px;color:#f5b301;letter-spacing:2px">'+st+'</div><h2>Спасибо за оценку!</h2>'+(s>=4?(d.rev?'<p>Будем рады, если оставите отзыв в 2ГИС — это очень помогает нам 🌸</p><a class="rbtn g" href="'+esc(d.rev)+'" target="_blank" rel="noopener">Оставить отзыв в 2ГИС</a>':'<p>Рады, что вам понравилось 🌸</p>'):'<p>Нам жаль, что что-то пошло не так. Мы уже знаем и свяжемся с вами.</p>')+'</div>'}
function draw(d){rateUi(d);
 const shop=d.shop||"Mirflowers";$("shop").innerHTML=esc(shop)+"<small>Статус заказа</small>";document.title=shop+" · статус заказа";
 const steps=d.dv?[[0,"Заказ принят"],[1,"Собираем букет"],[2,"Букет готов"],[3,"Курьер в пути"],[4,"Доставлен"]]:[[0,"Заказ принят"],[1,"Собираем букет"],[2,"Готов — можно забирать"],[4,"Выдан"]];
 let h;
 if(d.st===5){h='<div class="hero"><div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44"/></svg><div class="ic" style="color:var(--mut)">'+svg(IC[5])+'</div></div><h1 class="st">Заказ отменён</h1><p class="bn">'+esc(d.bn||"")+'</p><p class="note">Если это ошибка — позвоните или напишите нам.</p></div>'}
 else{const cur=Math.max(0,steps.findIndex(s=>s[0]===d.st)),last=steps.length-1,done=cur===last,pc=done?1:(cur+.5)/last,C=2*Math.PI*44;
  h='<div class="hero"><div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)"/></linearGradient></defs><circle class="bgc" cx="50" cy="50" r="44"/><circle class="fg" cx="50" cy="50" r="44" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pc)).toFixed(1)+'"/></svg><div class="ic"'+(done?' style="color:var(--ok)"':'')+'>'+svg(IC[steps[cur][0]])+'</div></div>'
   +'<h1 class="st">'+esc(steps[cur][1])+'</h1><p class="bn">'+esc(d.bn||"")+'</p>'+(d.date&&d.st<4?'<span class="when">'+svg('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>').replace('<svg','<svg width="16" height="16"')+(d.dv?"Доставка ":"Получение ")+esc(hd(d.date,d.time))+'</span>':"")+'</div>'
   +'<div class="card"><ol>'+steps.map((s,i)=>'<li class="'+(i<cur||done?"d":i===cur?"c":"")+'"><i>'+(i<cur||done?"✓":i+1)+'</i><span>'+esc(s[1])+'</span>'+(i===cur&&!done?"<b>сейчас</b>":"")+'</li>').join("")+'</ol></div>'
   +'<p class="note">Страница обновляется сама</p>'}
 $("main").innerHTML=h;
 const ph=String(d.phone||"").split(/[·,;]|\s{2,}/)[0].trim(),dig=ph.replace(/\D/g,"");
 if(dig.length>=10){$("bar").innerHTML='<a class="call" href="tel:+'+dig+'">'+svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>')+'Позвонить</a><a class="wa" href="https://wa.me/'+dig+'" target="_blank" rel="noopener">'+svg('<path d="M3 21l1.6-4.8A9 9 0 1 1 8 19.5z"/><path d="M8.5 9.5c.5 2 2 3.6 4 4.4l1.2-1.1 2 .9-.4 1.6c-3.6.3-7.3-3.4-7-7l1.6-.4.9 2z"/>')+'WhatsApp</a>';$("bar").hidden=false}}
async function load(){try{if(!/^[a-f0-9]{24}$/.test(k))throw 0;const d=await fdb.collection("pubOrders").doc(k).get();if(!d.exists)throw 0;draw(d.data())}catch(e){$("main").innerHTML='<div class="err"><div><div class="ring" style="width:110px"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44"/></svg><div class="ic" style="color:var(--mut)">'+svg(IC[5])+'</div></div><h1 class="st" style="font-size:24px">Заказ не найден</h1><p>Проверьте ссылку или напишите нам.</p></div></div>'}}
load();setInterval(load,30000);
</script></body></html>
