<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Статус заказа</title>
<style>:root{--bg:#f6f3ee;--card:#fff;--ink:#1c1a17;--mut:#6f6a62;--ac:#5a4636;--line:#ddd6cb}@media(prefers-color-scheme:dark){:root{--bg:#121110;--card:#1c1a18;--ink:#f1ede6;--mut:#a39d93;--ac:#c9a98a;--line:#34302b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Arial,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px 30px}
main{max-width:460px;margin:0 auto}h1{font-size:22px;margin:0 0 2px}.m{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.big{font-size:24px;font-weight:700;margin:2px 0 14px}ol{list-style:none;margin:0;padding:0}li{display:flex;gap:12px;align-items:center;padding:9px 0;color:var(--mut)}li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}li.d{color:var(--ink)}li.d i{background:var(--ac);border-color:var(--ac)}li.c{color:var(--ink);font-weight:700}li.c i{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}
a{color:var(--ac)}</style></head><body><main><h1 id="shop">Статус заказа</h1><div class="m" id="sub">Загрузка…</div><div class="card" id="box" hidden></div><p class="m" id="ft"></p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyCDxDJvmIOw8R0kP7bNbiBHYDAOqY_9cSQ",authDomain:"mirflowersbase.firebaseapp.com",projectId:"mirflowersbase",storageBucket:"mirflowersbase.firebasestorage.app",messagingSenderId:"142575786641",appId:"1:142575786641:web:de2d1b79b076894c29fd30"};firebase.initializeApp(cfg);const fdb=firebase.firestore();
const $=id=>document.getElementById(id),k=new URLSearchParams(location.search).get("t")||"";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function draw(d){
 $("shop").textContent=d.shop||"Статус заказа";$("sub").textContent=d.bn||"";document.title=(d.shop||"Заказ")+" · статус заказа";
 const steps=d.dv?[[0,"Заказ принят"],[1,"Собирается"],[2,"Готов"],[3,"В пути"],[4,"Доставлен"]]:[[0,"Заказ принят"],[1,"Собирается"],[2,"Готов, можно забирать"],[4,"Выдан"]];
 let h;
 if(d.st===5)h='<div class="big">Заказ отменён</div><div class="m">Если это ошибка, свяжитесь с магазином.</div>';
 else{const cur=steps.findIndex(s=>s[0]===d.st),last=steps.length-1;
  h='<div class="big">'+esc(steps[cur<0?0:cur][1])+'</div><ol>'+steps.map((s,i)=>'<li class="'+(i<cur||cur===last?"d":i===cur?"c":"")+'"><i></i>'+esc(s[1])+'</li>').join("")+'</ol>';
  if(d.date&&d.st<4)h+='<div class="m" style="margin-top:8px">Назначено на '+esc((d.date+" "+(d.time||"")).trim())+'</div>'}
 $("box").innerHTML=h;$("box").hidden=false;
 $("ft").innerHTML=d.phone?'Вопросы: <a href="tel:'+esc(d.phone.replace(/[^\d+]/g,""))+'">'+esc(d.phone)+'</a>':""}
async function load(){try{if(!/^[a-f0-9]{24}$/.test(k))throw 0;const d=await fdb.collection("pubOrders").doc(k).get();if(!d.exists)throw 0;draw(d.data())}catch(e){$("sub").textContent="Заказ не найден. Проверьте ссылку.";$("box").hidden=true}}
load();setInterval(load,30000);
</script></body></html>
