арту 2ГИС в Профиле.":"Иесінен Профильде 2ГИС картасын қосуды сұра.","Клиенту":"Клиентке","Автоматически отправлять клиенту фото готового букета":"Клиентке дайын букет фотосын автоматты жіберу","Скопировать смены с прошлой недели в пустые клетки этой?":"Өткен аптаның сменаларын осы аптаның бос ұяшықтарына көшіреміз бе?","График на сегодня не заполнен. Откройте вкладку «График».":"Бүгінгі график толтырылмаған. «График» вкладкасын аш.","Войдите рабочим аккаунтом. Аккаунты создаёт администратор.":"Жұмыс аккаунтымен кір. Аккаунттарды админ ашады.","Фото от курьера нет. Отметить заказ доставленным без фото?":"Курьерден фото жоқ. Заказды фотосыз жеткізілді деп белгілейміз бе?","Приёмка оператором: готовый заказ сначала проверяет оператор":"Оператор қабылдауы: дайын заказды алдымен оператор тексереді","Нажмите на плитку, чтобы увидеть, из чего складывается число.":"Сан неден құралатынын көру үшін плитканы бас.","Браузер запретил уведомления. Разрешите их в настройках сайта.":"Браузер хабарламаларға тыйым салды. Сайт баптауларында рұқсат бер.","Нечего копировать: на прошлой неделе пусто или эта уже заполнена":"Көшіретін ештеңе жоқ: өткен апта бос не осы апта толы","Здесь вы создаёте сотрудников, меняете роли и отключаете доступ.":"Мұнда қызметкер құрасың, рөлін өзгертесің, кіруін өшіресің.","На фото должен быть виден весь стол: инструменты, мусор, пол рядом.":"Фотода бүкіл үстел көрінуі керек: құралдар, қоқыс, жанындағы еден.","Стоимость = остаток × закупочная цена. Самые дорогие позиции сверху.":"Құны = қалдық × сатып алу бағасы. Ең қымбаттары жоғарыда.","Страницы магазина в интернете. «Открыть» откроет их в новой вкладке.":"Дүкеннің интернеттегі беттері. «Ашу» жаңа вкладкада ашады.","Готовый букет с витрины закрепится за заказом, статус станет «Готов».":"Витринадағы дайын букет заказға бекітіледі, статус «Дайын» болады.","Автоматически отправлять клиенту ссылку на статус заказа после создания":"Заказ құрылған соң клиентке статус сілтемесін автоматты жіберу","Кто, когда и что сделал. Видно только администратору. Последние 500 записей.":"Кім, қашан, не істеді. Тек админге көрінеді. Соңғы 500 жазба.","Нажмите на клетку, чтобы назначить смену или выходной. ⏳ — заявка сотрудника.":"Смена не демалыс қою үшін ұяшықты бас. ⏳ — қызметкердің заявкасы.","«вых» — выходной, «·» — не назначено, цифры внизу — сколько человек на смене.":"«дем» — демалыс, «·» — қойылмаған, төмендегі цифрлар — сменада неше адам.","Своя смена: нажмите на клетку, чтобы запросить изменение. Примет администратор.":"Өз сменаң: өзгерту сұрау үшін ұяшықты бас. Админ қабылдайды.","Считается по полю «Источник» в заказах, поэтому работает и без подключённых каналов.":"Заказдағы «Қайдан» өрісі бойынша есептеледі, сондықтан каналсыз да жұмыс істейді.","Считается автоматически: самовывоз −30 мин, доставка −1 час. Можно поправить вручную.":"Өзі есептеледі: өзі алып кету −30 мин, доставка −1 сағат. Қолмен түзетуге болады.","Ключ VAPID (Firebase Console, Project settings, Cloud Messaging, Web Push certificates)":"VAPID кілті (Firebase Console, Project settings, Cloud Messaging, Web Push certificates)","Все сотрудники. Если один человек работает и флористом, и оператором, его цифры объединены.":"Барлық қызметкер. Бір адам әрі флорист, әрі оператор болса, цифрлары бірігеді.","Включено: кнопка «Оплачен» сразу отмечает оплату. Выключено: перед отметкой оплаты сайт переспросит.":"Қосулы: «Төленді» бірден төлемді белгілейді. Өшірулі: белгілер алдында сайт қайта сұрайды.","Прикрепите фото у получателя или нажмите «Закрыть». В обоих случаях заказ получит статус «Доставлен».":"Алушының жанында фото тірке не «Жабу» бас. Екі жағдайда да заказ «Жеткізілді» статусын алады.","Отметьте, что сохранить. Получится один файл JSON. Храните его в надёжном месте: в нём данные клиентов.":"Нені сақтау керегін белгіле. Бір JSON файл шығады. Сенімді жерде сақта: ішінде клиент деректері бар.","Заказы считаются по последним 300. Собранные букеты для витрины и склада считаются с момента обновления.":"Заказдар соңғы 300 бойынша есептеледі. Витрина мен складқа жиналған букеттер жаңартудан бастап есептеледі.","Включайте и выключайте функции сайта для всей команды. Изменения вступают в силу после нажатия «Сохранить».":"Сайт функцияларын бүкіл командаға қос не өшір. Өзгерістер «Сақтау» басқаннан кейін күшіне енеді.","Удалить сотрудника полностью? Будут удалены аккаунт входа и профиль. Его заказы и записи журнала сохранятся.":"Қызметкерді толық өшіреміз бе? Кіру аккаунты мен профилі өшеді. Заказдары мен журнал жазбалары қалады.","Включено: когда букет готов, клиенту уходит фото с текстом из поля ниже. Выключено: фото отправляют вручную.":"Қосулы: букет дайын болса, клиентке төмендегі мәтінмен фото кетеді. Өшірулі: фотоны қолмен жібересің.","Готовые букеты, которые уже собраны. Выставить новый: кнопка «Добавить букет» (или Склад → Букеты → «На витрину»).":"Жиналып қойған дайын букеттер. Жаңасын қою: «Букет қосу» (не Склад → Букеттер → «Витринаға»).","Включено: в новом заказе галочка «отправить клиенту фото» уже стоит. Выключено: её нужно ставить вручную каждый раз.":"Қосулы: жаңа заказда «клиентке фото жіберу» белгісі тұрады. Өшірулі: әр жолы қолмен қою керек.","Когда флорист отметит заказ готовым, он сфотографирует букет, и фото сразу уйдёт клиенту с вопросом, всё ли нравится.":"Флорист заказды дайын деп белгілегенде букетті суретке түсіреді, фото бірден клиентке «ұнай ма?» деген сұрақпен кетеді.","Фильтр точки сверху: «Все точки» — общий итог, выбранная точка — только её данные. Прибыль и расходы смотрите в «Финансы».":"Жоғарыдағы нүкте сүзгісі: «Барлық нүкте» — жалпы қорытынды, таңдалған нүкте — тек соның деректері. Пайда мен шығынды «Қаржыдан» қара.","Это текст, который уходит клиенту вместе с фото готового букета. Подставляются: {имя} — имя клиента, {букет} — название букета.":"Бұл дайын букет фотосымен клиентке кететін мәтін. Қойылады: {имя} — клиенттің аты, {букет} — букет атауы.","Включено: у всех сотрудников есть вкладка «Чат» для переписки внутри команды. Выключено: вкладка скрыта, сообщения не пропадают.":"Қосулы: барлық қызметкерде команда ішінде жазысуға «Чат» вкладкасы бар. Өшірулі: вкладка жасырын, хабарламалар жоғалмайды.","Файл скачается на это устройство, в базе ничего не меняется. Кроме того, сервер каждый день в 03:00 сам сохраняет копию в Storage.":"Файл осы құрылғыға жүктеледі, базада ештеңе өзгермейді. Оған қоса сервер күнде 03:00-де Storage-ке өзі көшірме сақтайды.","Выключено: один общий склад. Включено: у каждой точки свои остатки, рецепты букетов общие. Текущие остатки останутся на основной точке.":"Өшірулі: бір ортақ склад. Қосулы: әр нүктенің өз қалдығы, букет рецептері ортақ. Қазіргі қалдық негізгі нүктеде қалады.","Включено: показывается вкладка «Чаты» с перепиской клиентов. Выключено: вкладка скрыта. Сами каналы WhatsApp и Instagram пока не подключены.":"Қосулы: клиенттермен жазысу «Чаттар» вкладкасы көрінеді. Өшірулі: вкладка жасырын. WhatsApp пен Instagram каналдары әзірге қосылмаған.","Выберите точку, на которой работаете. Без этого дальше не пустит. Выбор можно поменять потом в Профиле, он сбросится, когда закончится ваша смена.":"Қай нүктеде жұмыс істейтініңді таңда. Онсыз әрі қарай кіргізбейді. Кейін Профильде ауыстыруға болады, сменаң біткенде таңдау тазаланады.","Название, телефон, адрес и график видят все сотрудники; телефон ещё показывается клиенту на странице статуса заказа и на накладной. Валюта: тенге (₸).":"Атауын, телефонын, мекенжайы мен графигін барлық қызметкер көреді; телефон клиентке статус бетінде және накладнойда да көрінеді. Валюта: теңге (₸).","Точка, на которой вы сейчас находитесь: от неё зависят заказы, склад и отчёты, которые вы видите. Ошиблись или перешли на другую точку — нажмите «Изменить».":"Қазір тұрған нүктең: көретін заказ, склад және есептерің соған байланысты. Қателессең не басқа нүктеге ауыссаң — «Өзгерту» бас.","Ключ нужен один раз для всего магазина: без него push не заработают ни у кого. Взять его можно в Firebase Console, пустое поле и «Сохранить ключ» отключат push.":"Кілт бүкіл дүкенге бір рет керек: онсыз ешкімде push жұмыс істемейді. Оны Firebase Console-дан аласың, бос өріс пен «Кілтті сақтау» push-ты өшіреді.","Всплывающие сообщения, пока сайт открыт (новый заказ, готов букет и т. д.). Настройка только для этого устройства. Когда сайт закрыт, работает блок «Push на телефон» ниже.":"Сайт ашық тұрғанда шығатын хабарламалар (жаңа заказ, букет дайын т.б.). Баптау тек осы құрылғыға. Сайт жабық болса, төмендегі «Телефонға push» жұмыс істейді.","Точки — это отдельные магазины или филиалы. Сотрудника можно закрепить за точкой, а склад и отчёты можно вести отдельно по каждой. Если точка одна, ничего менять не нужно.":"Нүктелер — бөлек дүкендер не филиалдар. Қызметкерді нүктеге бекітуге болады, склад пен есепті әрқайсысына бөлек жүргізуге болады. Нүкте біреу болса, ештеңе өзгертпе.","Включено: флорист не закрывает заказ сам. Готовый заказ уходит оператору на проверку, и только после неё считается готовым. Выключено: «Готов» ставится сразу, без проверки.":"Қосулы: флорист заказды өзі жаппайды. Дайын заказ операторға тексеруге кетеді, тек содан кейін дайын саналады. Өшірулі: «Дайын» бірден, тексерусіз қойылады.","Уведомления приходят на телефон или компьютер, даже когда сайт закрыт. Включать нужно на каждом устройстве отдельно. Нажмите «Включить» и разрешите уведомления в окне браузера.":"Хабарламалар сайт жабық болса да телефонға не компьютерге келеді. Әр құрылғыда бөлек қосу керек. «Қосу» басып, браузер терезесінде рұқсат бер.","Включено: сразу после создания заказа клиенту уходит ссылка на страницу статуса, и сайт предлагает отправить её в WhatsApp. Выключено: ссылку берут вручную кнопкой «Ссылка клиенту».":"Қосулы: заказ құрылған бойда клиентке статус бетінің сілтемесі кетеді, сайт оны WhatsApp-қа жіберуді ұсынады. Өшірулі: сілтемені «Клиентке сілтеме» батырмасымен қолмен аласың.","Включено: в меню есть «Сделки»: воронка для крупных и корпоративных заказов, пока они не стали обычным заказом. Если так не работаете, выключите: раздел исчезнет, а данные останутся.":"Қосулы: мәзірде «Мәмілелер» бар: ірі және корпоративтік заказдар воронкасы, олар қарапайым заказ болғанша. Олай жұмыс істемесең, өшір: бөлім жоғалады, деректер қалады.","Закупки цветов и упаковки уже учтены через себестоимость при списании, поэтому в расходы не входят. Отменённые заказы в выручку не попадают. Себестоимость берётся из рецепта букета с тем же названием.":"Гүл мен орама сатып алу списание кезінде өзіндік құн арқылы есептелген, сондықтан шығынға кірмейді. Отмена болған заказдар түсімге кірмейді. Өзіндік құны аттас букет рецептінен алынады.","Входящие сообщения клиентов появятся во вкладке «Чаты», ответы уходят из CRM. Ключи сохраняются на сервере, после сохранения их нельзя прочитать из сайта. 2ГИС не имеет API для ответов: сообщения из 2ГИС записываются вручную.":"Клиенттердің хабарламалары «Чаттар» вкладкасында шығады, жауаптар CRM-нен кетеді. Кілттер серверде сақталады, сақталған соң сайттан оқу мүмкін емес. 2ГИС-те жауап API-і жоқ: 2ГИС хабарламалары қолмен жазылады.","Внешний вид сайта: светлая или тёмная тема, цвета, размер текста. Цвета акцента и текста запоминаются отдельно для светлой и тёмной темы. Видно только вам и только на этом устройстве, у других сотрудников ничего не изменится. Изменения применяются сразу.":"Сайттың сыртқы түрі: ашық не қараңғы тема, түстер, мәтін өлшемі. Акцент пен мәтін түсі ашық және қараңғы тема үшін бөлек сақталады. Тек саған және тек осы құрылғыда көрінеді, басқаларда ештеңе өзгермейді. Өзгерістер бірден қолданылады.","Безвозвратно стирает выбранные данные из базы (например, тестовые заказы перед запуском). Это не то же самое, что «Сбросить статистику» (она только скрывает старое). Сначала сделайте резервную копию выше. Перед удалением сайт покажет список и попросит ввести слово УДАЛИТЬ.":"Таңдалған деректерді базадан біржола өшіреді (мысалы, іске қосар алдындағы тест заказдар). Бұл «Статистиканы нөлдеумен» бірдей емес (ол тек ескісін жасырады). Алдымен жоғарыда резервтік көшірме жаса. Өшірер алдында сайт тізімді көрсетіп, УДАЛИТЬ сөзін енгізуді сұрайды.","Воронка для крупных и корпоративных заказов: ведите переговоры здесь, пока клиент не решился. Каждая колонка — этап: новая заявка, в работе, ожидает оплаты, завершена или не состоялась (с причиной). Нажмите на карточку, чтобы сменить этап. Не нужен раздел? Профиль, Возможности, «Раздел Сделки».":"Ірі және корпоративтік заказдар воронкасы: клиент шешкенше келіссөзді осында жүргіз. Әр баған — кезең: жаңа заявка, жұмыста, төлемді күтіп тұр, аяқталды не болмады (себебімен). Кезеңді ауыстыру үшін карточканы бас. Бөлім керек емес пе? Профиль, Мүмкіндіктер, «Мәмілелер бөлімі».",
"Лёгкий режим":"Жеңіл режим","убирает размытие, тени, анимации и миниатюры фото в списках, а заказов в списке показывает по 30 (кнопка «Показать ещё»). Данные и функции те же, просто телефон меньше нагружается. «Авто» включает лёгкий режим сам, если телефон слабый (мало памяти или процессор 2 ядра) или включена экономия трафика. Сейчас:":"бұлдырлықты, көлеңкені, анимацияны және тізімдегі фото миниатюраларын алып тастайды, заказдарды 30-дан көрсетеді («Тағы көрсету» батырмасы). Деректер мен функциялар сол, тек телефонға жүк аз түседі. Телефон әлсіз болса (жады аз не процессор 2 ядро) не трафик үнемдеу қосулы болса, «Авто» жеңіл режимді өзі қосады. Қазір:",
"Вкладка «Карта» показывает все доставки на карте 2ГИС: цвет метки — статус, нажатие — открыть заказ. Курьер видит свои и свободные доставки и своё местоположение. Нужен ключ 2ГИС (один на весь магазин): получите его в кабинете разработчика 2ГИС (platform.2gis.ru) — нужны «MapGL JS API» и «Геокодер». Адреса превращаются в точки один раз и запоминаются на телефоне.":"«Карта» вкладкасы барлық доставканы 2ГИС картасында көрсетеді: белгінің түсі — статус, басу — заказды ашу. Курьер өз доставкаларын, бос доставкаларды және өзі тұрған жерді көреді. 2ГИС кілті керек (бүкіл дүкенге біреу): оны 2ГИС әзірлеуші кабинетінен ал (platform.2gis.ru) — «MapGL JS API» мен «Геокодер» керек. Мекенжайлар нүктеге бір рет айналып, телефонда сақталады.",
"Профиль → «Карта 2ГИС»: вставьте ключ 2ГИС, и здесь появятся все доставки на карте.":"Профиль → «2ГИС картасы»: 2ГИС кілтін қой, сонда мұнда барлық доставка картада шығады.",

const PUBRE=/^[a-f0-9]{24}$/;
const pubUrl=k=>new URL("status.html?t="+k,location.href).href;
const pubBusy=new Set();
const revOf=l=>{const k=l||"main",u=(SH.revUrl||{})[k];if(u)return u;const n=String(lname(k)||"").split(",")[0].trim(),f=n&&LK.find(x=>/2ГИС/.test(x[0])&&x[0].includes(n));return f?f[1]+"/tab/reviews":""};
const pubKeyOf=o=>[+o.st,o.date||"",o.time||"",o.dv?1:0,o.bn||"",revOf(o.loc)].join("|");
async function pubSync(o){const k=o.pub;if(!PUBRE.test(k||"")||pubBusy.has(k))return;pubBusy.add(k);try{const key=pubKeyOf(o);await db.collection("pubOrders").doc(k).set({bn:o.bn||"",st:+o.st||0,dv:!!o.dv,date:o.date||"",time:o.time||"",shop:SH.name||"",phone:SH.phone||"",rev:revOf(o.loc),ts:Date.now()});await db.collection("orders").doc(o.id).update({pubKey:key});o.pubKey=key}finally{pubBusy.delete(k)}}
async function pubTok(o){if(PUBRE.test(o.pub||"")){await pubSync(o);return o.pub}const a=new Uint8Array(12);crypto.getRandomValues(a);const k=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");await db.collection("orders").doc(o.id).update({pub:k,updatedAt:TS()});o.pub=k;await pubSync(o);return k}
function pubAuto(l){if(!S||!mgr())return;l.forEach(o=>{if(PUBRE.test(o.pub||"")&&o.pubKey!==pubKeyOf(o))pubSync(o).catch(()=>{})})}
function qrSvg(u){try{const q=qrcode(0,"M");q.addData(u);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return""}}

 return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>${WBS[sz][1]}body{font-family:-apple-system,Arial,sans-serif;color:#000;margin:0;line-height:1.35}h1{font-size:20px;margin:0}h2{font-size:15px;margin:2px 0 8px;font-weight:400}table{width:100%;border-collapse:collapse}td{padding:4px 0;border-bottom:1px solid #bbb;vertical-align:top}td:first-child{width:34%;color:#444}.t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}.q{text-align:center;font-size:9px}.s{font-size:20px;font-weight:700;margin-top:8px}.b{margin-top:10px;display:flex;justify-content:space-between;font-size:11px;color:#444}</style></head><body><div class="t"><div><h1>${esc(SH.name||"Mirflowers")}</h1><h2>Накладная · заказ №${esc(String(o.id).slice(-5).toUpperCase())}</h2></div><div class="q">${qr||""}<div>Статус заказа</div></div></div><table>${row("Букет",esc(o.bn))}${row("Состав",esc(o.comp))}${row("Клиент",esc(o.client))}${row("Телефон",esc(o.phone))}${row("Получение",esc(((o.date||"")+" "+(o.time||"")).trim()))}${row("Способ",o.dv?"Доставка: "+esc(o.addr):"Самовывоз")}${row("Открытка",esc(o.card))}${row("Комментарий",esc(o.note))}${row("Цена",M(o.p))}${row("Доставка",o.fee?M(o.fee):"")}${row("Предоплата",o.pre?M(o.pre):"")}</table><div class="s">${o.paid?"Оплачено":"К оплате: "+M(rest(o))}</div><div class="b"><span>${esc(SH.phone||"")}</span></div></body></html>`}

function locUntil(){const n=Date.now(),d=today();let best=0;[addD(d,-1),d].forEach(dy=>{const s=SHL.find(x=>x.uid===U.uid&&x.date===dy&&x.t==="work"&&x.from&&x.to);if(!s)return;const a=new Date(dy+"T"+s.from).getTime();let z=new Date(dy+"T"+s.to).getTime();if(z<=a)z+=864e5;if(a-36e5<=n&&z>n)best=Math.max(best,z)});return best||n+12*36e5}
