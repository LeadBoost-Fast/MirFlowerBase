/* Тихие ошибки: не теряются, а пишутся в журнал диагностики (Профиль → «Связь с базой») */
window.ERRL=[];window.eLog=function(e){try{const st=String((e&&e.stack)||new Error().stack||"").split("\n").map(x=>x.trim()).find(x=>/at \w/.test(x)&&!/eLog/.test(x))||"",fn=(st.match(/at ([\w.$]+)/)||[])[1]||"";ERRL.push([Date.now(),((e&&e.code?e.code+": ":"")+String(e&&e.message||e)).slice(0,200)+(fn?" ["+fn+"]":"")]);if(ERRL.length>60)ERRL.shift()}catch(_){}};
/* Свои окна вместо системных confirm()/prompt() iPhone. Код сайта вызывает confirm/prompt как раньше:
   первый вызов показывает окно сайта и возвращает «нет»; после «Да» тот же клик повторяется, и вызов
   с тем же текстом получает «да» (или введённый текст). Без недавнего клика — системное окно, как раньше. */
(function(){const nC=window.confirm.bind(window),nP=window.prompt.bind(window);let last=null,lastT=0,busy=false;const okC=new Map(),okP=new Map();
 document.addEventListener("click",e=>{if(e.isTrusted||e.__ask){last=e.target;lastT=Date.now()}},true);
 const esc0=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 function box(msg,inp,def,ro,done){busy=true;const o=document.createElement("div");o.id="askov";o.innerHTML=`<div class="askb" role="dialog" aria-modal="true"><div class="askm">${esc0(msg).replace(/\n/g,"<br>")}</div>${inp?`<input class="aski" value="${esc0(def)}" ${ro?"readonly":""}>`:""}<div class="aska">${ro?"":`<button type="button" class="btn g" data-k="0">Отмена</button>`}<button type="button" class="btn" data-k="1">${ro?"Готово":inp?"OK":"Да"}</button></div></div>`;
  document.body.appendChild(o);const i=o.querySelector(".aski");setTimeout(()=>{try{if(i){i.focus();if(ro)i.select()}else o.querySelector('[data-k="1"]').focus()}catch(_){}},40);
  const fin=k=>{const v=i?i.value:"";o.remove();busy=false;done(k,v)};o.onclick=e=>{const b=e.target.closest("[data-k]");if(b)fin(b.dataset.k==="1");else if(e.target===o&&!ro)fin(false)};
  if(i)i.onkeydown=e=>{if(e.key==="Enter")fin(true)}}
 const again=el=>{setTimeout(()=>{try{const ev=new MouseEvent("click",{bubbles:true,cancelable:true});ev.__ask=1;el.dispatchEvent(ev)}catch(e){eLog(e)}},30)};
 window.confirm=function(msg){msg=String(msg);if(window.__NATIVEASK)return nC(msg);const t=okC.get(msg);if(t&&t>Date.now())return true;
  const el=last;if(busy||!el||!el.isConnected||Date.now()-lastT>2500)return nC(msg);
  box(msg,false,"",false,k=>{if(k){okC.set(msg,Date.now()+30000);again(el)}});return false};
 window.prompt=function(msg,def){msg=String(msg);if(window.__NATIVEASK)return nP(msg,def);if(okP.has(msg)){const v=okP.get(msg);if(v.t>Date.now()){okP.delete(msg);return v.v}okP.delete(msg)}
  const ro=/^Скопируйте/.test(msg),el=last;if(busy||((!el||!el.isConnected||Date.now()-lastT>2500)&&!ro))return nP(msg,def);
  box(msg,true,def==null?"":def,ro,(k,v)=>{if(k&&!ro){okP.set(msg,{v,t:Date.now()+30000});again(el)}});return null}})();
window.__mfErr="";
window.addEventListener("error",function(e){window.__mfErr=(e&&e.message)||"error";});
window.addEventListener("unhandledrejection",function(e){window.__mfErr=(e&&e.reason&&(e.reason.message||e.reason))||"promise";});
setTimeout(function(){

    if(!v)return;

    if(!/Подключение|Долгое/.test(v.textContent||""))return;
    var err=window.__mfErr||(!window.firebase?"Firebase SDK не загрузился (проверьте интернет / блокировщик)":"Firebase не ответил. В Firebase Console → Authentication → Settings → Authorized domains добавьте: "+location.hostname);
    v.innerHTML='<div class="card" style="margin-top:12vh"><h1>Mirflowers</h1><p class="mut">'+String(err).replace(/</g,"&lt;")+'</p><p class="mut">Домен: '+location.hostname+'</p><button class="btn" onclick="location.reload()">Обновить</button></div>';
  }catch(e){eLog(e)}
}, 8000);
