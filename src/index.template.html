(function(){const nC=window.confirm.bind(window),nP=window.prompt.bind(window);let last=null,lastT=0,busy=false;const okC=new Map(),okP=new Map();

  const fin=k=>{const v=i?i.value:"";o.remove();busy=false;done(k,v)};o.onclick=e=>{const b=e.target.closest("[data-k]");if(b)fin(b.dataset.k==="1");else if(e.target===o&&!ro)fin(false)};
  if(i)i.onkeydown=e=>{if(e.key==="Enter")fin(true)}}
 const again=el=>{setTimeout(()=>{try{const ev=new MouseEvent("click",{bubbles:true,cancelable:true});ev.__ask=1;el.dispatchEvent(ev)}catch(e){eLog(e)}},30)};
