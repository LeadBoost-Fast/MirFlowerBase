name: Deploy shop

# Выкладка одного магазина в его проект Firebase: сайт, правила и функции с его настройками.
# Запуск вручную: Actions → Deploy shop → Run workflow, в поле shop вписать название папки из shops/ (например almaty1).
# Нужен секрет FIREBASE_SA_<ИМЯ ЗАГЛАВНЫМИ> (весь JSON-ключ службы этого проекта), например FIREBASE_SA_ALMATY1.
on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Название папки магазина в shops/ (латиница и цифры)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка названия
        env:
          SHOP: ${{ inputs.shop }}
        run: echo "$SHOP" | grep -Eq '^[a-z0-9]{2,20}$' && test -d "shops/$SHOP"
      - name: Установка сборщика и Firebase CLI
        run: |
          cd build && npm ci
          npm install -g firebase-tools
      - name: Сборка сайта и пакета магазина
        env:
          SHOP: ${{ inputs.shop }}
        run: |
          node build/build.mjs --check
          node tools/new-shop.mjs bundle "$SHOP"
      - name: Зависимости функций
        run: npm install
        working-directory: dist/${{ inputs.shop }}/functions
      - name: Ключ доступа магазина
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          SHOP: ${{ inputs.shop }}
        run: |
          UP=$(echo "$SHOP" | tr a-z A-Z)
          echo "$ALL_SECRETS" | jq -er --arg k "FIREBASE_SA_$UP" '.[$k]' > "$RUNNER_TEMP/sa.json"
      - name: Выкладка
        working-directory: dist/${{ inputs.shop }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only hosting,firestore:rules,functions,storage --non-interactive --force
