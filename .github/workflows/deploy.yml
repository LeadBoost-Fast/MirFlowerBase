name: Deploy Firebase

# Запускается сам, когда меняются функции или правила. Можно запустить вручную: вкладка Actions → Deploy Firebase → Run workflow
on:
  push:
    branches: [main, master]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка Firebase CLI
        run: npm install -g firebase-tools
      - name: Установка зависимостей функций
        run: npm install
        working-directory: functions
      - name: Ключ доступа
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Деплой
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only firestore:rules,functions,storage --project mirflowersbase --non-interactive --force
