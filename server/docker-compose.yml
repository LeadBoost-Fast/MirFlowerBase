# Сервисы CRM на одном сервере. Запуск: cd /opt/crm && docker compose up -d
# База данных (PostgreSQL) и HTTPS-прокси (Caddy) готовы. Сам сервер приложения (app) появится на Этапе 1:
# до этого раздел закомментирован.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: crm
      POSTGRES_DB: crm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]   # только с самого сервера, наружу порт закрыт
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./site:/srv/site:ro
